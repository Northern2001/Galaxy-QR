<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Me</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        :root {
            --indigo: #4F46E5; --violet: #7C3AED; --pink: #EC4899;
            --brand: linear-gradient(135deg, #4F46E5, #7C3AED, #EC4899);
            --bg: #F5F6FB; --surface: #fff; --text: #12131A; --muted: #5B5F73; --outline: #E3E5EE; --hover: #EEF0F7;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0B0D17; --surface: #151827; --text: #E6E8F2; --muted: #A9ADC4; --outline: #2A2E48; --hover: #232741; }
        }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        .hero { background: var(--brand); height: 190px; border-radius: 0 0 32px 32px; }
        .wrap { max-width: 560px; margin: -120px auto 0; padding: 0 16px 32px; }
        .profile { background: var(--surface); border-radius: 32px; box-shadow: 0 16px 40px rgba(79, 70, 229, .25);
            padding: 0 24px 24px; text-align: center; }
        .avatar-ring { width: 118px; height: 118px; border-radius: 50%; background: var(--brand); padding: 4px;
            margin: 0 auto; transform: translateY(-40px); }
        .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--surface);
            border: 3px solid var(--surface); }
        .profile-body { margin-top: -28px; }
        h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; }
        #bioId { white-space: pre-line; color: var(--muted); margin: 0; }
        .phone-btn { display: inline-block; margin-top: 14px; padding: 10px 20px; border-radius: 14px; font-weight: 600;
            color: #fff; background: var(--brand); text-decoration: none; }
        .phone-btn:hover { color: #fff; opacity: .92; }
        .section-title { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
            color: var(--muted); text-align: left; margin: 24px 4px 8px; }
        .link-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: 10px;
            background: var(--surface); border: 1px solid var(--outline); border-radius: 16px;
            text-decoration: none; color: inherit; text-align: left; transition: background .15s, transform .15s; }
        .link-item:hover { background: var(--hover); color: inherit; transform: translateY(-1px); }
        .brand-dot { width: 44px; height: 44px; border-radius: 50%; color: #fff; display: flex;
            align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; font-weight: 600; }
        .brand-dot img { width: 22px; height: 22px; }
        .link-item small { color: var(--muted); }
        .footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 24px; }
        .footer b { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
    </style>
</head>

<body>
    <div class="hero"></div>
    <div class="wrap">
        <div class="profile">
            <div class="avatar-ring"><img id="avatarId" alt="Avatar"></div>
            <div class="profile-body">
                <h1 id="nameId"></h1>
                <p id="bioId"></p>
                <a id="phoneId" class="phone-btn" hidden></a>
                <div id="linksTitle" class="section-title" hidden>Liên kết</div>
                <div id="linksId"></div>
                <p id="emptyId" class="text-center mt-3 mb-0" style="color: var(--muted)" hidden>Chưa có thông tin.</p>
            </div>
        </div>
        <p class="footer">Made with <b>ScanMe</b> by Northern</p>
    </div>

    <script>
        // Tham số do app tạo (xem GenerateQrContentUseCase): name, bio, phone, avatar, link (lặp nhiều lần).
        var params = new URLSearchParams(window.location.search);

        // Nền tảng nhận diện theo host — giữ khớp với SocialPlatform.kt của app.
        var PLATFORMS = [
            ["Facebook", ["facebook.com", "fb.com", "fb.me"], "#0866FF", "facebook"],
            ["Messenger", ["m.me", "messenger.com"], "#0084FF", "messenger"],
            ["Instagram", ["instagram.com", "instagr.am"], "#E1306C", "instagram"],
            ["Threads", ["threads.net", "threads.com"], "#000000", "threads"],
            ["TikTok", ["tiktok.com"], "#000000", "tiktok"],
            ["YouTube", ["youtube.com", "youtu.be"], "#FF0000", "youtube"],
            ["X", ["x.com", "twitter.com"], "#000000", "x"],
            ["LinkedIn", ["linkedin.com"], "#0A66C2", null],
            ["GitHub", ["github.com"], "#181717", "github"],
            ["Telegram", ["t.me", "telegram.me"], "#26A5E4", "telegram"],
            ["Zalo", ["zalo.me"], "#0068FF", "zalo"],
            ["WhatsApp", ["wa.me", "whatsapp.com"], "#25D366", "whatsapp"],
            ["Discord", ["discord.gg", "discord.com"], "#5865F2", "discord"],
            ["Spotify", ["spotify.com"], "#1DB954", "spotify"]
        ];

        // Chỉ cho phép http(s), mailto, tel — chặn javascript: và các scheme nguy hiểm khác.
        function safeUrl(raw) {
            raw = (raw || "").trim();
            if (!raw) return null;
            if (!/^[a-z][a-z0-9+.-]*:/i.test(raw)) {
                raw = /^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(raw) ? "mailto:" + raw : "https://" + raw;
            }
            return /^(https?:|mailto:|tel:)/i.test(raw) ? raw : null;
        }

        var SVG_ICONS = {
            email: "M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z",
            web: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3.1a15.7 15.7 0 0 0-1.4-6A8 8 0 0 1 18.9 11zM12 4c.8 1 1.7 3 2 7h-4c.3-4 1.2-6 2-7zM4.3 13h3.1a15.7 15.7 0 0 0 1.4 6A8 8 0 0 1 4.3 13zm3.1-2H4.3a8 8 0 0 1 4.5-6 15.7 15.7 0 0 0-1.4 6zM12 20c-.8-1-1.7-3-2-7h4c-.3 4-1.2 6-2 7zm3.2-1a15.7 15.7 0 0 0 1.4-6h3.1a8 8 0 0 1-4.5 6z"
        };
        function svgIcon(key) {
            var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("width", "22"); svg.setAttribute("height", "22");
            var p = document.createElementNS(ns, "path"); p.setAttribute("d", SVG_ICONS[key]); p.setAttribute("fill", "#fff");
            svg.appendChild(p); return svg;
        }

        function detect(url) {
            if (/^mailto:/i.test(url)) return { name: "Email", color: "#EA4335", slug: null, icon: "email" };
            var host = "";
            try { host = new URL(url).hostname.toLowerCase(); } catch (e) { }
            for (var i = 0; i < PLATFORMS.length; i++) {
                var p = PLATFORMS[i];
                if (p[1].some(function (h) { return host === h || host.endsWith("." + h); })) {
                    return { name: p[0], color: p[2], slug: p[3] };
                }
            }
            return { name: "Website", color: "#4F46E5", slug: null, icon: "web" };
        }

        var name = (params.get("name") || "").trim();
        var bio = (params.get("bio") || "").trim();
        var phone = (params.get("phone") || "").trim();
        var avatar = safeUrl(params.get("avatar"));
        var links = params.getAll("link").map(safeUrl).filter(Boolean);

        // Dùng textContent (không dùng innerHTML) để dữ liệu từ URL không chèn được mã HTML/JS.
        document.getElementById("nameId").textContent = name || "Chưa cập nhật";
        document.getElementById("bioId").textContent = bio;
        document.getElementById("bioId").hidden = !bio;

        var img = document.getElementById("avatarId");
        var fallbackAvatar = "data:image/svg+xml," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" fill="#EEF0F7"/>' +
            '<circle cx="12" cy="9" r="4" fill="#A5B4FC"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#A5B4FC"/></svg>');
        img.onerror = function () { img.onerror = null; img.src = fallbackAvatar; };
        img.referrerPolicy = "no-referrer";
        img.src = avatar && /^https?:/i.test(avatar) ? avatar : fallbackAvatar;

        if (phone) {
            var a = document.getElementById("phoneId");
            a.href = "tel:" + phone.replace(/[^\d+]/g, "");
            a.textContent = "📞 " + phone;
            a.hidden = false;
        }

        var box = document.getElementById("linksId");
        links.forEach(function (url) {
            var p = detect(url);
            var row = document.createElement("a");
            row.className = "link-item";
            row.href = url;
            if (/^https?:/i.test(url)) { row.target = "_blank"; row.rel = "noopener noreferrer"; }

            var dot = document.createElement("div");
            dot.className = "brand-dot";
            dot.style.background = p.color;
            if (p.slug) {
                var ic = document.createElement("img");
                ic.src = "https://cdn.simpleicons.org/" + p.slug + "/white";
                ic.alt = p.name;
                ic.onerror = function () {
                    if (!ic.dataset.retry) {   // CDN dự phòng: SVG đen → đảo thành trắng
                        ic.dataset.retry = "1";
                        ic.style.filter = "brightness(0) invert(1)";
                        ic.src = "https://cdn.jsdelivr.net/npm/simple-icons/icons/" + p.slug + ".svg";
                    } else { dot.textContent = p.name[0]; ic.remove(); }
                };
                dot.appendChild(ic);
            } else if (p.icon) {
                dot.appendChild(svgIcon(p.icon));
            } else {
                dot.textContent = p.name === "LinkedIn" ? "in" : p.name[0];
            }

            var text = document.createElement("div");
            text.className = "text-truncate";
            var title = document.createElement("div");
            title.className = "fw-semibold";
            title.textContent = p.name;
            var sub = document.createElement("small");
            
            sub.textContent = url.replace(/^(https?:\/\/|mailto:)/i, "");
            text.appendChild(title);
            text.appendChild(sub);

            row.appendChild(dot);
            row.appendChild(text);
            box.appendChild(row);
        });

        document.getElementById("linksTitle").hidden = !links.length;
        document.getElementById("emptyId").hidden = !!(name || bio || phone || links.length);
    </script>
</body>

</html>
