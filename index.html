<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="ScanMe — your whole profile in one QR code">
    <title>ScanMe</title>
    <style>
        /* Bảng màu khớp với presentation/theme/Color.kt của app ScanMe. */
        :root {
            --indigo: #4F46E5;
            --violet: #7C3AED;
            --pink: #EC4899;
            --gradient: linear-gradient(135deg, var(--indigo), var(--violet), var(--pink));
            --bg: #F5F5FA;
            --surface: #FFFFFF;
            --text: #1E1B4B;
            --muted: #6B7280;
            --outline: #E5E7EB;
            --row-hover: #F3F4F6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F0E1A;
                --surface: #1B1A2B;
                --text: #F3F4F6;
                --muted: #A1A1AA;
                --outline: #2E2C44;
                --row-hover: #26243A;
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Header gradient kết thúc ngang tâm ảnh đại diện → ảnh "nổi" lên trên, giống form trong app. */
        .hero {
            background: var(--gradient);
            border-radius: 0 0 32px 32px;
            height: 180px;
            padding-top: env(safe-area-inset-top);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding-top: 20px;
            color: #fff;
            font-weight: 600;
            font-size: 20px;
        }

        .brand svg { width: 24px; height: 24px; }

        main {
            max-width: 480px;
            margin: -84px auto 0;
            padding: 0 16px calc(24px + env(safe-area-inset-bottom));
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 28px;
            padding: 0 20px 20px;
            box-shadow: 0 12px 32px rgba(30, 27, 75, 0.12);
        }

        .avatar {
            width: 112px;
            height: 112px;
            margin: 0 auto;
            transform: translateY(-40px);
            margin-bottom: -40px;
            border-radius: 50%;
            border: 4px solid var(--surface);
            background: var(--gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar svg { width: 56px; height: 56px; }

        h1 {
            margin: 12px 0 0;
            font-size: 24px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .bio {
            margin: 6px 0 0;
            color: var(--muted);
            text-align: center;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        #content {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .section-title {
            margin: 12px 4px 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            border-radius: 16px;
            color: inherit;
            text-decoration: none;
            transition: background 0.15s;
        }

        .row:hover, .row:focus-visible { background: var(--row-hover); outline: none; }

        .platform-icon {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #fff;
            overflow: hidden;
        }

        .platform-icon img { position: absolute; inset: 24%; width: 52%; height: 52%; }
        .platform-icon svg { width: 55%; height: 55%; }
        .platform-letter { font-weight: 700; font-size: 18px; }
        .phone-icon { background: #16A34A; }

        .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .row-title { font-weight: 600; }

        .row-subtitle {
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-open { flex: none; width: 20px; height: 20px; color: var(--muted); }

        .row-action {
            flex: none;
            padding: 6px 14px;
            border-radius: 999px;
            background: #16A34A;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .empty { text-align: center; padding: 8px 0 12px; }
        .empty-title { margin: 0; font-weight: 600; }
        .empty-hint { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

        #actions:empty { display: none; }
        #actions { margin-top: 16px; }

        .save-contact {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 16px;
            background: var(--gradient);
            color: #fff;
            font: inherit;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .save-contact svg { width: 20px; height: 20px; }

        footer {
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <header class="hero">
        <div class="brand">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm2 2h2v2h-2v-2zm-6 2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm2 2h2v2h-2v-2zM6 6h2v2H6V6zm10 0h2v2h-2V6zM6 16h2v2H6v-2z" />
            </svg>
            <span>ScanMe</span>
        </div>
    </header>

    <main>
        <section class="card">
            <div id="avatar" class="avatar"></div>
            <h1 id="name"></h1>
            <p id="bio" class="bio"></p>
            <div id="content"></div>
            <div id="actions"></div>
        </section>
        <footer id="made-with"></footer>
    </main>

    <script src="index.js"></script>
</body>

</html>
